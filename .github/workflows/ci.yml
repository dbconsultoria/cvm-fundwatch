name: ci

on:
  pull_request:
  push:
    branches: [main, development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no floating major tag, so it is pinned to an exact release.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest -m "not network"

  # The dashboard must build on every change, from synthetic reporting tables (no lake needed).
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      - name: Demo reporting tables
        run: uv run python dashboard/scripts/demo_data.py demo

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Build
        working-directory: dashboard
        env:
          REPORTING_DIR: ${{ github.workspace }}/demo
          CVM_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          npm ci
          npm run build

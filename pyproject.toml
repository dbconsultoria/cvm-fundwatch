[project]
name = "cvm-fundwatch"
version = "0.1.0"
description = "Bronze/silver/gold lake of Brazilian investment fund data (CVM, BCB) on Hugging Face, with anomaly detection."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4",
    "pyarrow>=21",
    "huggingface_hub>=1.2",
    "httpx>=0.28",
    "tenacity>=9",
    "pyyaml>=6",
    "tzdata>=2025.2",
    "scikit-learn>=1.6",
    "skops>=0.11",
]

[project.scripts]
cvm-lake = "cvm_lake.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvm_lake"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH", "N"]

[tool.ruff.lint.per-file-ignores]
# Fixture rows are copied verbatim from real source files.
"tests/fakes.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cvm_lake"]
known-local-folder = ["fakes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: test needs network access (never run in CI; deselected by default)",
]
